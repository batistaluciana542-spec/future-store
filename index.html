<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loja Futurística | Produtos</title>

<style>
:root{
  --bg:#070812;
  --panel:#0d1020;
  --panel2:#11162a;
  --text:#f5f7ff;
  --muted:#98a0bd;
  --line:#252b49;
  --a:#8b5cf6;
  --b:#22d3ee;
  --pink:#ec4899;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at 15% 10%,#25145d 0,transparent 32%),
    radial-gradient(circle at 90% 20%,#063f52 0,transparent 28%),
    var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,Arial,sans-serif
}

button,input,select,textarea{font:inherit}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#070812dd;
  backdrop-filter:blur(18px);
  border-bottom:1px solid #8b5cf633;
  display:flex;
  align-items:center;
  gap:18px;
  padding:16px 5vw
}

.logo{
  font-weight:900;
  font-size:22px
}

.logo span{color:var(--b)}

.search{
  flex:1;
  max-width:620px
}

.search input{
  width:100%;
  padding:13px 18px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#0b0e1b;
  color:white;
  outline:none
}

.iconbtn,.cart{
  border:1px solid var(--line);
  background:#0d1122;
  color:white;
  border-radius:13px;
  padding:11px 13px;
  cursor:pointer
}

.menu{position:relative}

.panel{
  display:none;
  position:absolute;
  right:0;
  top:50px;
  width:260px;
  background:#0d1020;
  border:1px solid #333a62;
  border-radius:18px;
  padding:10px;
  box-shadow:0 20px 60px #0008
}

.panel.open{display:block}

.panel button{
  width:100%;
  padding:11px;
  border:0;
  background:transparent;
  color:#dfe3f6;
  text-align:left;
  border-radius:10px;
  cursor:pointer
}

.panel button:hover{background:#ffffff0b}

.hero{
  padding:65px 5vw 38px;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:35px;
  align-items:center
}

.eyebrow{
  color:var(--b);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
  font-size:12px
}

.hero h1{
  font-size:clamp(42px,7vw,82px);
  line-height:.95;
  margin:12px 0 20px
}

.grad{
  background:linear-gradient(90deg,#fff,var(--b),#a78bfa,#f0abfc);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.hero p{
  color:var(--muted);
  font-size:17px;
  max-width:620px;
  line-height:1.6
}

.cta{
  display:flex;
  gap:12px;
  margin-top:26px
}

.primary,.secondary{
  border-radius:13px;
  padding:13px 18px;
  font-weight:800;
  cursor:pointer
}

.primary{
  border:0;
  background:linear-gradient(100deg,var(--a),var(--pink));
  color:white
}

.secondary{
  background:#ffffff0b;
  color:white;
  border:1px solid var(--line)
}

.orb{
  height:330px;
  border-radius:35px;
  border:1px solid #ffffff1c;
  background:#0c1020;
  display:grid;
  place-items:center
}

.orb:before{
  content:"";
  width:190px;
  height:190px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff,#8b5cf6 28%,#22d3ee 58%,transparent 70%);
  box-shadow:0 0 100px #22d3ee88,0 0 150px #8b5cf688
}

.section{
  padding:24px 5vw 70px
}

.chips{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:4px 0 24px
}

.chip{
  white-space:nowrap;
  border:1px solid var(--line);
  background:#0d1120;
  color:#cbd2ea;
  padding:10px 14px;
  border-radius:999px;
  cursor:pointer
}

.chip.active{
  border-color:var(--a);
  background:#8b5cf620;
  color:white
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}

.card{
  background:linear-gradient(180deg,#11162a,#0b0e1b);
  border:1px solid #242a48;
  border-radius:20px;
  overflow:hidden
}

.pic{
  height:190px;
  display:grid;
  place-items:center;
  background:radial-gradient(circle,#29315d,#0a0d18 65%);
  font-size:65px
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover
}

.body{padding:16px}

.tag{
  font-size:11px;
  color:var(--b);
  font-weight:800;
  text-transform:uppercase
}

.name{
  font-weight:800;
  font-size:17px;
  margin:7px 0
}

.desc{
  font-size:13px;
  color:var(--muted);
  min-height:38px
}

.price{
  font-size:22px;
  font-weight:900;
  margin:13px 0
}

.buy{
  width:100%;
  padding:11px;
  border:0;
  border-radius:11px;
  background:linear-gradient(90deg,var(--a),#6d5dfc);
  color:#fff;
  font-weight:800;
  cursor:pointer
}

.dev,.checkout{
  position:fixed;
  inset:0;
  background:#000b;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px
}

.dev.show,.checkout.show{display:flex}

.devbox,.checkoutbox{
  width:min(920px,100%);
  max-height:92vh;
  overflow:auto;
  background:#0d1020;
  border:1px solid #39436f;
  border-radius:22px;
  padding:22px;
  box-shadow:0 30px 100px #000
}

.devhead,.checkouthead{
  display:flex;
  justify-content:space-between;
  align-items:center
}

.devgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px
}

.tool{
  padding:18px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#11162a;
  color:white;
  cursor:pointer;
  text-align:left
}

.tool b{
  display:block;
  margin-bottom:6px
}

.tool span{
  color:var(--muted);
  font-size:13px
}

.toolbox{
  padding:16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#0a0e1c
}

.toolbox h3{margin:0 0 8px}

.toolbox p{color:var(--muted)}

.editlist{
  display:grid;
  gap:10px
}

.editrow{
  display:grid;
  grid-template-columns:1.5fr .8fr .9fr auto;
  gap:8px
}

.toolbox input,
.toolbox select{
  padding:11px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0b0e1b;
  color:white
}

.checkoutgrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.checkoutgrid .full{
  grid-column:1/-1
}

.checkout label{
  display:block;
  color:#cbd2ea;
  font-size:12px;
  margin-bottom:5px
}

.checkout input,
.checkout select,
.checkout textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0b0e1b;
  color:white
}

.checkout textarea{
  min-height:75px
}

.checkoutactions{
  display:flex;
  gap:10px;
  margin-top:16px
}

.checkoutactions button{
  flex:1
}

.order-summary{
  margin:12px 0;
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#11162a
}

.toast{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:#151a30;
  border:1px solid #39436f;
  padding:12px 17px;
  border-radius:12px;
  transition:.25s;
  z-index:100
}

.toast.show{
  transform:translateX(-50%) translateY(0)
}

@media(max-width:900px){
  .hero{grid-template-columns:1fr}
  .orb{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:700px){
  .editrow{grid-template-columns:1fr 1fr}
  .devgrid{grid-template-columns:1fr}
}

@media(max-width:580px){
  .top{flex-wrap:wrap}
  .search{
    order:3;
    flex-basis:100%
  }
  .grid{grid-template-columns:1fr}
  .hero{padding-top:42px}
  .checkoutgrid{grid-template-columns:1fr}
  .checkoutgrid .full{grid-column:auto}
}
</style>
</head>

<body>

<header class="top">
  <div class="logo">NEXUS <span>STORE</span></div>

  <div class="search">
    <input id="search" placeholder="Buscar produtos..." oninput="render()">
  </div>

  <button class="cart" onclick="toast('Carrinho aberto.')">
    🛒 <span id="count">0</span>
  </button>

  <div class="menu">
    <button class="iconbtn" onclick="toggleMenu()">⋮</button>

    <div id="menuPanel" class="panel">
      <button onclick="openDev()">⚙️ Painel do desenvolvedor</button>
      <button onclick="openTool('products')">📦 Editar produtos</button>
      <button onclick="openTool('categories')">🏷️ Categorias</button>
      <button onclick="openTool('images')">🖼️ Imagens</button>
      <button onclick="openTool('orders')">🧾 Pedidos</button>
      <button onclick="openTool('stats')">📊 Estatísticas</button>
      <button onclick="openTool('appearance')">🎨 Aparência</button>
      <button onclick="openTool('settings')">🔧 Configurações</button>
    </div>
  </div>
</header>

<section class="hero">
  <div>
    <div class="eyebrow">Nova geração de compras</div>

    <h1>
      Produtos incríveis.<br>
      <span class="grad">Uma loja do futuro.</span>
    </h1>

    <p>
      Uma vitrine futurística para vender eletrônicos,
      acessórios e utilidades.
    </p>

    <div class="cta">
      <button class="primary"
        onclick="document.getElementById('produtos').scrollIntoView({behavior:'smooth'})">
        Explorar produtos
      </button>

      <button class="secondary" onclick="openDev()">
        Área do desenvolvedor
      </button>
    </div>
  </div>

  <div class="orb"></div>
</section>

<section class="section" id="produtos">
  <div class="chips" id="chips"></div>
  <div class="grid" id="grid"></div>
</section>

<div class="checkout" id="checkout">

  <div class="checkoutbox">

    <div class="checkouthead">
      <div>
        <div class="eyebrow">Finalizar compra</div>
        <h2>Dados de entrega</h2>
      </div>

      <button class="iconbtn" onclick="closeCheckout()">✕</button>
    </div>

    <div id="orderSummary" class="order-summary"></div>

    <div class="checkoutgrid">

      <div>
        <label>Nome completo *</label>
        <input id="customerName">
      </div>

      <div>
        <label>Telefone *</label>
        <input id="customerPhone">
      </div>

      <div>
        <label>CEP *</label>
        <input id="customerCep">
      </div>

      <div>
        <label>Estado *</label>
        <select id="customerState">
          <option value="">Selecione</option>
          <option>GO</option>
          <option>MG</option>
          <option>SP</option>
          <option>DF</option>
          <option>BA</option>
          <option>MT</option>
          <option>MS</option>
          <option>RJ</option>
          <option>PR</option>
          <option>SC</option>
          <option>RS</option>
          <option>Outro</option>
        </select>
      </div>

      <div>
        <label>Cidade *</label>
        <input id="customerCity">
      </div>

      <div>
        <label>Bairro *</label>
        <input id="customerDistrict">
      </div>

      <div class="full">
        <label>Rua / Avenida *</label>
        <input id="customerStreet">
      </div>

      <div>
        <label>Número *</label>
        <input id="customerNumber">
      </div>

      <div>
        <label>Complemento</label>
        <input id="customerComplement">
      </div>

      <div class="full">
        <label>Forma de pagamento *</label>
        <select id="customerPayment">
          <option value="">Selecione</option>
          <option>Pix</option>
          <option>Cartão de crédito</option>
          <option>Cartão de débito</option>
          <option>Dinheiro</option>
          <option>A combinar na entrega</option>
        </select>
      </div>

      <div class="full">
        <label>Observações</label>
        <textarea id="customerNotes"></textarea>
      </div>

    </div>

    <div class="checkoutactions">
      <button class="secondary" onclick="closeCheckout()">Cancelar</button>
      <button class="primary" onclick="finishOrder()">
        Enviar pedido pelo WhatsApp
      </button>
    </div>

  </div>
</div>

<div class="dev" id="dev">

  <div class="devbox">

    <div class="devhead">
      <div>
        <div class="eyebrow">Acesso administrativo</div>
        <h2>Painel do desenvolvedor</h2>
      </div>

      <button class="iconbtn" onclick="closeDev()">✕</button>
    </div>

    <div class="devgrid">

      <button class="tool" onclick="openTool('products')">
        <b>📦 Produtos</b>
        <span>Editar produtos online.</span>
      </button>

      <button class="tool" onclick="openTool('categories')">
        <b>🏷️ Categorias</b>
        <span>Organizar categorias.</span>
      </button>

      <button class="tool" onclick="openTool('images')">
        <b>🖼️ Imagens</b>
        <span>Escolher fotos da galeria.</span>
      </button>

      <button class="tool" onclick="openTool('orders')">
        <b>🧾 Pedidos</b>
        <span>Abrir WhatsApp.</span>
      </button>

      <button class="tool" onclick="openTool('stats')">
        <b>📊 Estatísticas</b>
        <span>Ver informações da loja.</span>
      </button>

      <button class="tool" onclick="openTool('appearance')">
        <b>🎨 Aparência</b>
        <span>Configurações visuais.</span>
      </button>

      <button class="tool" onclick="openTool('settings')">
        <b>⚙️ Configurações</b>
        <span>Configurações gerais.</span>
      </button>

    </div>

    <div id="toolArea" style="margin-top:18px"></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://atqmvcmovhsnpcxwodab.supabase.co';

const SUPABASE_KEY =
'sb_publishable_ATqnGIIg3019efrccOgWXA_CrbBZSeC';

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const products=[];

let cat='Todos';
let cart=0;
let currentProduct='';
let cats=['Todos'];


function toast(message){

  const el=document.getElementById('toast');

  el.textContent=message;

  el.classList.add('show');

  setTimeout(()=>{
    el.classList.remove('show');
  },3000);
}


function money(v){

  return Number(v||0).toLocaleString(
    'pt-BR',
    {
      style:'currency',
      currency:'BRL'
    }
  );
}


function priceNumber(v){

  return Number(
    String(v)
      .replace(/[^0-9,.-]/g,'')
      .replace(/\./g,'')
      .replace(',','.')
  ) || 0;

}


function rebuildCats(){

  cats=[
    'Todos',
    ...new Set(
      products
        .map(p=>p[3])
        .filter(Boolean)
    )
  ];

  document.getElementById('chips').innerHTML =
    cats.map(c=>`
      <button
        class="chip ${c==='Todos'?'active':''}"
        onclick="setCat('${String(c).replace(/'/g,"\\'")}',this)">
        ${c}
      </button>
    `).join('');
}


async function loadProducts(){

  try{

    const {data,error} =
      await db
        .from('products')
        .select(
          'id,name,price,description,emoji,image,category'
        )
        .order('id');

    if(error) throw error;

    products.length=0;

    (data||[]).forEach(r=>{

      const p=[
        r.name,
        money(r.price),
        r.emoji||'📦',
        r.category||'Geral',
        r.image||'',
        r.description||
        'Produto premium com design moderno.'
      ];

      p._id=r.id;

      products.push(p);

    });

    rebuildCats();
    render();

  }catch(error){

    console.error(error);

    toast(
      'Erro ao carregar produtos online.'
    );

  }

}


function setCat(c,b){

  cat=c;

  document
    .querySelectorAll('.chip')
    .forEach(x=>x.classList.remove('active'));

  if(b) b.classList.add('active');

  render();

}


function render(){

  const search =
    document
      .getElementById('search')
      .value
      .toLowerCase();

  const list =
    products.filter(p=>
      (cat==='Todos'||p[3]===cat) &&
      p[0].toLowerCase().includes(search)
    );

  document.getElementById('grid').innerHTML =
    list.map(p=>`

      <article class="card">

        <div class="pic">

          ${
            p[4]
            ?
            `<img src="${p[4]}" alt="${p[0]}">`
            :
            p[2]
          }

        </div>

        <div class="body">

          <div class="tag">${p[3]}</div>

          <div class="name">${p[0]}</div>

          <div class="desc">${p[5]||''}</div>

          <div class="price">${p[1]}</div>

          <button
            class="buy"
            onclick="buy('${String(p[0]).replace(/'/g,"\\'")}')">
            Comprar
          </button>

        </div>

      </article>

    `).join('') ||
    '<p style="color:#98a0bd">Nenhum produto encontrado.</p>';

}


function buy(name){

  currentProduct=name;

  cart++;

  document.getElementById('count').textContent=cart;

  document.getElementById('orderSummary').innerHTML=
    '<b>Produto:</b> '+name+
    '<br><b>Quantidade:</b> 1';

  document
    .getElementById('checkout')
    .classList.add('show');

}


function closeCheckout(){

  document
    .getElementById('checkout')
    .classList.remove('show');

}


function finishOrder(){

  const fields={

    name:customerName.value.trim(),
    phone:customerPhone.value.trim(),
    cep:customerCep.value.trim(),
    state:customerState.value,
    city:customerCity.value.trim(),
    district:customerDistrict.value.trim(),
    street:customerStreet.value.trim(),
    number:customerNumber.value.trim(),
    payment:customerPayment.value

  };

  if(Object.values(fields).some(v=>!v)){

    toast('Preencha todos os campos obrigatórios.');

    return;

  }

  const complement=
    customerComplement.value.trim();

  const notes=
    customerNotes.value.trim();

  const msg=
`Olá! Quero fazer um pedido.

Produto: ${currentProduct}
Quantidade: 1

DADOS DO CLIENTE
Nome: ${fields.name}
Telefone: ${fields.phone}

ENDEREÇO DE ENTREGA
CEP: ${fields.cep}
Estado: ${fields.state}
Cidade: ${fields.city}
Bairro: ${fields.district}
Rua/Avenida: ${fields.street}
Número: ${fields.number}
Complemento: ${complement||'Não informado'}

Pagamento: ${fields.payment}
Observações: ${notes||'Nenhuma'}`;

  window.open(
    'https://wa.me/5564996609321?text='+
    encodeURIComponent(msg),
    '_blank'
  );

  closeCheckout();

  toast('Pedido preparado no WhatsApp.');

}


function toggleMenu(){

  document
    .getElementById('menuPanel')
    .classList.toggle('open');

}


function openDev(){

  const senha=
    prompt('Digite a senha do desenvolvedor:');

  if(senha==='1943'){

    document
      .getElementById('dev')
      .classList.add('show');

    document
      .getElementById('menuPanel')
      .classList.remove('open');

    openTool('products');

  }else if(senha!==null){

    toast('Senha incorreta.');

  }

}


function closeDev(){

  document
    .getElementById('dev')
    .classList.remove('show');

}


/* =========================
   EDITOR DE PRODUTOS
========================= */

function openTool(type){

  const area=
    document.getElementById('toolArea');


  if(type==='products'){

    area.innerHTML=`

      <div class="toolbox">

        <h3>📦 Editor de produtos</h3>

        <p>
          Altere nome, preço e categoria.
        </p>

        <div class="editlist">

          ${
            products.map((p,i)=>`

              <div class="editrow">

                <input
                  id="pn${i}"
                  value="${p[0]}">

                <input
                  id="pp${i}"
                  value="${p[1]}">

                <select id="pc${i}">

                  ${
                    cats.slice(1).map(c=>`
                      <option
                        ${c===p[3]?'selected':''}>
                        ${c}
                      </option>
                    `).join('')
                  }

                </select>

                <button
                  class="primary"
                  onclick="saveProduct(${i})">
                  Salvar
                </button>

              </div>

            `).join('')
          }

        </div>

      </div>

    `;

    return;

  }


  if(type==='images'){

    area.innerHTML=`

      <div class="toolbox">

        <h3>🖼️ Imagens dos produtos</h3>

        <p>
          Escolha um produto e selecione uma foto
          diretamente da galeria do celular.
        </p>

        <select
          id="imgProduct"
          style="width:100%;padding:12px">

          ${
            products.map((p,i)=>`
              <option value="${i}">
                ${p[0]}
              </option>
            `).join('')
          }

        </select>

        <input
          id="imgFile"
          type="file"
          accept="image/*"
          style="
            width:100%;
            margin-top:10px;
            padding:12px;
            border-radius:10px;
            border:1px solid var(--linborder:1px solid var(--lin
